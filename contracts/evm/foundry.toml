[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Arc testnet. Values come from the official Circle Arc docs (Build_Guide Task 6.0).
[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[etherscan]
arc_testnet = { key = "${ARC_SCAN_API_KEY}", url = "${ARC_SCAN_VERIFY_URL}" }
